<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="red-dome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="white-dome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Main Ball Body Group with Shadow -->
  <g filter="url(#drop-shadow)">
    <!-- Ball Base Outline/Border -->
    <circle cx="256" cy="256" r="200" fill="#0f172a"/>

    <!-- Top Half (Red Dome) -->
    <path d="M 56 256 A 200 200 0 0 1 456 256 Z" fill="url(#red-dome)"/>

    <!-- Bottom Half (White Dome) -->
    <path d="M 56 256 A 200 200 0 0 0 456 256 Z" fill="url(#white-dome)"/>

    <!-- Middle Dark Band -->
    <rect x="56" y="234" width="400" height="44" fill="#0f172a"/>

    <!-- Center Button Outer Ring -->
    <circle cx="256" cy="256" r="68" fill="#0f172a"/>

    <!-- Center Button Inner White -->
    <circle cx="256" cy="256" r="44" fill="#ffffff"/>
    <circle cx="256" cy="256" r="44" fill="none" stroke="#cbd5e1" stroke-width="4"/>

    <!-- Glossy Highlight Arc -->
    <ellipse cx="256" cy="110" rx="120" ry="40" fill="#ffffff" opacity="0.25"/>
  </g>
</svg>
